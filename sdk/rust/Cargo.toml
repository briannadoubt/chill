[package]
name = "chill-observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Privacy-first portable Chill observability SDK"
documentation = "https://docs.chill.dev/sdk/rust"
homepage = "https://chill.dev"
repository = "https://github.com/briannadoubt/Chill"

[lib]
name = "chill_observability"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
