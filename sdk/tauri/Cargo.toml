[package]
name = "chill-tauri"
version = "0.1.0"
edition = "2021"
description = "Privacy-first metadata-only Tauri command and event correlation for Chill"
license = "Apache-2.0"
repository = "https://github.com/briannadoubt/chill"
keywords = ["observability", "tauri", "telemetry", "privacy"]
categories = ["development-tools::debugging"]

[features]
default = []
# The framework glue is opt-in so the deterministic metadata core has no GUI
# dependency. The host's Chill client remains the only exporter.
sdk = ["dep:chill-observability"]
tauri = ["sdk", "dep:tauri", "dep:serde", "dep:serde_json"]

[dependencies]
tauri = { version = "2", optional = true, default-features = false }
chill-observability = { path = "../rust", version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
