name: chill-control-plane

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: chill
      POSTGRES_USER: chill_admin
      POSTGRES_PASSWORD: chill_admin_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chill_admin -d chill"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - chill-postgres:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: chill_local
      MINIO_ROOT_PASSWORD: chill_local_secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - chill-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 chill_local chill_local_secret &&
        mc mb --ignore-existing local/chill &&
        mc version enable local/chill

volumes:
  chill-postgres:
  chill-minio:
