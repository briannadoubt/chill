[workspace]
resolver = "3"
members = [
    "crates/chill-control-plane",
    "crates/chill-ingest",
    "crates/chill-lake",
    "crates/chill-lifecycle",
    "crates/chill-normalize",
    "crates/chill-objects",
    "crates/chill-query",
    "crates/chill-migrations",
    "crates/chillctl",
    "crates/chilld",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/briannadoubt/chill"

[workspace.dependencies]
anyhow = "1.0.103"
arrow = { version = "59.1.0", default-features = false }
axum = "0.8.9"
aws-config = { version = "=1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
base64 = "0.23.0"
bytes = "1.11.1"
clap = { version = "4.6.2", features = ["derive"] }
duckdb = { version = "1.10504.0", features = ["json", "parquet"] }
flate2 = "1.1.9"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.4"
jsonschema = { version = "0.53.0", default-features = false }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "logs", "metrics", "trace", "with-serde"] }
object_store = { version = "0.14.1", default-features = false, features = ["aws", "fs"] }
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "zstd"] }
prost = "0.14.3"
prost-types = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
subtle = "2.6.1"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52.4", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14.2"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
