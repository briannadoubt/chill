name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject committed credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Contracts and repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contract.txt

      - name: Install contract validator
        run: python -m pip install --requirement requirements-contract.txt

      - name: Verify generated contracts and repository policy
        run: |
          python scripts/repository_contract.py verify
          python scripts/validate_documentation.py

      - name: Validate contract fixtures and conformance
        run: |
          python scripts/validate-contract-fixtures.py
          python scripts/run-conformance-suite.py
          scripts/run-portable-conformance.sh
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Prove source archives are reproducible
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          scripts/prepare-release-assets.sh "$version" "$RUNNER_TEMP/release-a"
          scripts/prepare-release-assets.sh "$version" "$RUNNER_TEMP/release-b"
          diff -u "$RUNNER_TEMP/release-a/manifest.json" "$RUNNER_TEMP/release-b/manifest.json"
          while IFS= read -r artifact; do
            cmp "$RUNNER_TEMP/release-a/$artifact" "$RUNNER_TEMP/release-b/$artifact"
          done < <(find "$RUNNER_TEMP/release-a" -maxdepth 1 -type f -printf '%f\n' | sort)

  backend-rust-quality:
    name: Rust backend ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [test, clippy, format]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Run tests
        if: matrix.check == 'test'
        working-directory: backend
        run: cargo test --workspace --locked

      - name: Run Clippy
        if: matrix.check == 'clippy'
        working-directory: backend
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        if: matrix.check == 'format'
        working-directory: backend
        run: cargo fmt --all -- --check

  backend-security:
    name: Rust dependency and source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Reject vulnerable or untrusted Rust dependencies
        working-directory: backend
        run: cargo deny check advisories licenses sources

  backend-integration:
    name: Backend Postgres and object-store integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Run integration suite
        run: scripts/test-backend-integration.sh

  backend-query-release:
    name: Rust release query gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Exercise bounded query plans in release mode
        run: scripts/run-query-benchmarks.sh

  backend-image:
    name: Backend OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: chill/backend:ci
          build-args: CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

  console:
    name: Console client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Validate client
        working-directory: console
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high

  console-image:
    name: Console static OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: console/Dockerfile
          push: false
          tags: chill/console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-sdk:
    name: Browser SDK contract and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: sdk/web/package-lock.json

      - name: Verify browser SDK
        working-directory: sdk/web
        run: |
          npm ci
          npm run check
          npm test
          npm run bundle-budget
          npm run benchmark
          npm audit --audit-level=high

  portable-rust-sdk:
    name: Portable Rust SDK and Linux targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
          rustup target add --toolchain 1.95.0 aarch64-unknown-linux-gnu

      - name: Install Linux cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Verify portable Rust package
        working-directory: sdk/rust
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo doc --no-deps --locked
          cargo check --locked --target aarch64-unknown-linux-gnu
          cargo package --locked

  portable-javascript-sdk:
    name: Node, Deno, Bun, and Electron adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.7.14"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: Verify portable JavaScript workspace
        working-directory: sdk/js
        run: |
          npm ci
          npm run check
          npm test
          npm run smoke
          npm run pack:verify
          npm audit --audit-level=high

  tauri-sdk:
    name: Tauri 2 host adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Verify Tauri host package
        working-directory: sdk/tauri
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --features sdk --locked
          cargo clippy --all-targets --features sdk --locked -- -D warnings
          cargo check --features tauri --locked
          # The first registry package resolves only after chill-observability is published.
          cargo package --locked --list

  android-sdk:
    name: Android SDK contract and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Android platform
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify Android SDK
        working-directory: sdk/android
        run: |
          ./gradlew --no-daemon test lint assembleRelease
          scripts/check-budgets.sh

  swift-package-contract:
    name: Swift package contract on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swiftlang/swift:nightly-6.4.x-noble@sha256:9d0b3c2f3ffd173431f70caa87f4ace63e0dc10d2c8dd981b66cf6be66702a3b
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache resolved Swift dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sdk/swift/.build/ci-linux
          key: swift-6.4-linux-${{ runner.arch }}-${{ hashFiles('sdk/swift/Package.resolved') }}

      - name: Validate manifest, dependency lock, format, and API shape
        run: scripts/validate-swift-package-linux.sh
