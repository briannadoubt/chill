name: Scheduled security exercise

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 6"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fuzz:
    name: Rust parser and plan fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install pinned cargo-fuzz
        run: rustup run nightly cargo install cargo-fuzz --locked --version 0.13.2

      - name: Exercise attacker-controlled Rust boundaries
        env:
          CHILL_FUZZ_SECONDS: "60"
        run: scripts/run-rust-fuzz-smoke.sh

  abuse-integration:
    name: Tenant and abuse integration suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Exercise RLS, credentials, quotas, replay, query, and lifecycle boundaries
        run: scripts/test-backend-integration.sh
