version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(actions)"

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: monthly
      time: "09:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      rust-crates:
        patterns: ["*"]
    commit-message:
      prefix: "build(rust)"

  - package-ecosystem: gradle
    directories:
      - /sdk/android
      - /sdk/android/android
      - /sdk/android/core
      - /sdk/android/samples
    schedule:
      interval: monthly
      time: "10:20"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      android-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(android)"

  - package-ecosystem: swift
    directory: /sdk/swift
    schedule:
      interval: monthly
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(swift)"

  - package-ecosystem: swift
    directory: /sdk/swift/Examples
    schedule:
      interval: monthly
      time: "09:45"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      swift-example-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(swift-examples)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "10:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      python-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(python)"

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: monthly
      time: "10:05"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      console-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(console)"
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /sdk/rust
    schedule:
      interval: monthly
      time: "10:10"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      portable-rust-crates:
        patterns: ["*"]
    commit-message:
      prefix: "build(rust-sdk)"

  - package-ecosystem: npm
    directory: /sdk/js
    schedule:
      interval: monthly
      time: "10:12"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      portable-javascript-packages:
        patterns: ["*"]
    commit-message:
      prefix: "build(js-sdk)"
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /sdk/tauri
    schedule:
      interval: monthly
      time: "10:14"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      tauri-crates:
        patterns: ["*"]
    commit-message:
      prefix: "build(tauri)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      time: "10:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      backend-base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build(container)"

  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: monthly
      time: "10:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      dev-images:
        patterns: ["*"]
    commit-message:
      prefix: "build(dev-images)"

  - package-ecosystem: docker-compose
    directory: /deploy/single-node
    schedule:
      interval: monthly
      time: "10:45"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    groups:
      deploy-images:
        patterns: ["*"]
    commit-message:
      prefix: "build(deploy-images)"
